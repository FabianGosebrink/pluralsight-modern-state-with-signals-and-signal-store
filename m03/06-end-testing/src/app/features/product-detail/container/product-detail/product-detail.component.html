<a class="back-link" routerLink="products">Back</a>

@if (store.loading()) {
  Loading...
} @else if (store.productDetail(); as product) {
  <div class="detail-container">
    <app-product-image [imageUrl]="product.imageUrl" />

    <app-product-info
      (addToCartClicked)="dispatch.addToCartClicked($event)"
      [product]="product"
    />
  </div>
}
