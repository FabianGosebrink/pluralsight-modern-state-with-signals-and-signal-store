<div class="list">
  @for (product of products(); track $index) {
    <app-product-list-entry
      (removeClicked)="onRemoveClicked($index)"
      [product]="product"
    />
  }
  <div class="total-container">
    <div class="total">
      <strong>Total: {{ totalAmount() | currency: "CHF " }}</strong>
    </div>
  </div>
</div>
