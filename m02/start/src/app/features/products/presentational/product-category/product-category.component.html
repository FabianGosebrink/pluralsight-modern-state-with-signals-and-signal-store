<div class="product-category">
  <h4>{{ categoryName() }}</h4>
  <div class="products">
    @for (product of products(); track product.id) {
      <app-product
        (cartClicked)="cartClicked.emit($event)"
        (clicked)="clicked.emit($event)"
        [product]="product"
      />
    }
  </div>
</div>
